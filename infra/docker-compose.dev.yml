# Dev overlay: bind-mount source for live reload.
# Usage: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up --build
#
# Do NOT use this overlay for the Windows installer under Program Files —
# creating the anonymous /app/node_modules mountpoint there fails (ACL: Users RX).

services:
  api:
    volumes:
      - ../apps/api:/app
      - ../packages:/packages
      - ../workers:/workers

  importer-worker:
    volumes:
      - ../apps/api:/app
      - ../packages:/packages
      - ../workers:/workers

  recommender-worker:
    volumes:
      - ../apps/api:/app
      - ../packages:/packages
      - ../workers:/workers

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web.dev
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
